[[image.rules]]
rule = "string:isaac"

[[image.rules]]
rule = "prefix:docker_"

[[image.rules]]
rule = "suffix:_ws"

[[image.rules]]
rule = "@basename"

[build]
target_arch = ""
network = "auto"

[[build.args]]
key = "APT_MIRROR_UBUNTU"
value = "tw.archive.ubuntu.com"

[[build.args]]
key = "APT_MIRROR_DEBIAN"
value = "mirror.twds.com.tw"

[[build.args]]
key = "TZ"
value = "Asia/Taipei"

[deploy]
gpu_mode = "auto"
gpu_count = "all"
gpu_capabilities = "all"
gpu_runtime = "auto"

[gui]
mode = "off"

[network]
mode = "host"
ipc = "host"
pid = "host"
network_name = ""
ports = []

[security]
privileged = true
cap_drop = []

[[security.cap_add]]
cap = "SYS_ADMIN"

[[security.cap_add]]
cap = "NET_ADMIN"

[[security.cap_add]]
cap = "MKNOD"

[[security.security_opt]]
opt = "seccomp:unconfined"

[resources]
shm_size = ""

[environment]
env_1 = "ACCEPT_EULA=Y"
env_2 = "PRIVACY_CONSENT=Y"
env_8 = "PYTHONPATH=/home/${USER_NAME}/work/framework:/home/${USER_NAME}/work/src/docker/framework"

[devices]
cgroup_rules = []

[[devices.bindings]]
path = "/dev:/dev"

[[volumes]]
source = "${WS_PATH}"
target = "/home/${USER_NAME}/work"

[[volumes]]
source = "${WS_PATH}/isaac-sim/kit/cache"
target = "/isaac-sim/kit/cache"

[[volumes]]
source = "${WS_PATH}/isaac-sim/kit/data"
target = "/isaac-sim/kit/data"

[[volumes]]
source = "${WS_PATH}/isaac-sim/kit/logs"
target = "/isaac-sim/kit/logs"

[[volumes]]
source = "${WS_PATH}/isaac-sim/ov/cache"
target = "/home/${USER_NAME}/.cache/ov"

[[volumes]]
source = "${WS_PATH}/isaac-sim/ov/data"
target = "/home/${USER_NAME}/.local/share/ov/data"

[[volumes]]
source = "${WS_PATH}/isaac-sim/ov/logs"
target = "/home/${USER_NAME}/.nvidia-omniverse/logs"

[[volumes]]
source = "${WS_PATH}/isaac-sim/pip"
target = "/home/${USER_NAME}/.cache/pip"

[[volumes]]
source = "${WS_PATH}/isaac-sim/nvidia/glcache"
target = "/home/${USER_NAME}/.cache/nvidia/GLCache"

[[volumes]]
source = "${WS_PATH}/isaac-sim/nvidia/computecache"
target = "/home/${USER_NAME}/.nv/ComputeCache"

[[volumes]]
source = "${WS_PATH}/isaac-sim/documents"
target = "/home/${USER_NAME}/Documents"

["stage:gui"]
# "auto" would inherit the top-level [gui] mode of "off".
"gui.mode" = "force"

["stage:headless"]
"gui.mode" = "off"

["stage:stream"]
"gui.mode" = "off"

["stage:producer"]
"gui.mode" = "off"

["stage:test-tools-stage"]
"deploy.gpu_mode" = "off"
"gui.mode" = "off"

["stage:devel-test"]
"deploy.gpu_mode" = "force"
"gui.mode" = "off"

