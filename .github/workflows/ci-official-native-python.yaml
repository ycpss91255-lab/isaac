name: "CI: Official Native Python"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The shared GPU runner serializes this job with stream-smoke.
jobs:
  core-official-nativepython:
    uses: ycpss91255-lab/.github/.github/workflows/gpu-self-hosted.yml@v0.4.0
    with:
      run-script: ./script/ci/official_nativepython_job.sh
      timeout-minutes: 120
      artifact-name: official-nativepython
      artifact-path: artifacts/official-nativepython
      artifact-when: always
      reap-container-filter: label=com.docker.compose.project=isaac-official-nativepython-${{ github.run_id }}-${{ github.run_attempt }}
