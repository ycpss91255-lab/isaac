name: "CI: Stream Visual E2E"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-visual-e2e:
    uses: ycpss91255-lab/.github/.github/workflows/gpu-self-hosted.yml@v0.4.0
    with:
      run-script: ./script/ci/stream_visual_e2e_job.sh
      timeout-minutes: 30
      reap-container-filter: name=^/isaac-visual-${{ github.run_id }}-${{ github.run_attempt }}-
      artifact-name: stream-visual-e2e
      artifact-path: artifacts/stream-visual-e2e
      artifact-when: failure
